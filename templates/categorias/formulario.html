{# Formulario compartido para crear y editar categorías. #}
{# La vista pasa el título en la variable "titulo", #}
{# así que con una sola plantilla sirven para las dos cosas. #}
{% extends "base.html" %}

{% block content %}

<h1>
    {{ titulo }}
</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Guardar
    </button>

</form>

{% endblock %}
